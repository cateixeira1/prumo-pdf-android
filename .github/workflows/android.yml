name: Android - compilar, testar e gerar o app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Preparar o Android SDK (API 37, NDK e CMake para a parte em C++)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
          mkdir -p out/logs
          echo "commit=${GITHUB_SHA}" > out/STATUS.txt

      - name: Conferir as traduções (todo texto da interface traduzido nos 11 idiomas)
        run: python3 tools/i18n_check.py 2>&1 | tee out/logs/i18n.txt

      - name: Testes de unidade (biblioteca, library.json compartilhado, idiomas, seleção de páginas)
        run: ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee out/logs/unit-tests.txt

      - name: Compilar (teste, emulador e versão de publicação)
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease 2>&1 | tee out/logs/build.txt

      - name: Juntar os resultados
        if: always()
        run: |
          mkdir -p apks out/unit
          cp app/build/outputs/apk/debug/app-debug.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk apks/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml out/unit/ 2>/dev/null || true
          python3 - <<'PY' >> out/STATUS.txt
          import glob, re
          t = f = 0
          for p in glob.glob("out/unit/*.xml"):
              s = open(p, encoding="utf-8").read()
              m = re.search(r'tests="(\d+)".*?failures="(\d+)"', s)
              t += int(m[1]); f += int(m[2])
          print(f"testes de unidade: {t}, falhas: {f}")
          PY
          ls -la apks >> out/STATUS.txt

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build
          path: |
            apks
            out

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            profile: pixel_8
          - name: tablet
            profile: pixel_tablet
          - name: fold
            profile: pixel_fold
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: build

      - name: Ativar a aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes e capturas no emulador (${{ matrix.name }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/device-out
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash ci/run_device_tests.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: device-${{ matrix.name }}
          path: device-out

  publish:
    needs: [build, device]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Publicar resultados (branch ci-output)
        run: |
          OUT="$PWD/ci-output"
          mkdir -p "$OUT/screenshots" "$OUT/logs"
          cp -r artifacts/build/out/. "$OUT/"
          for d in artifacts/device-*; do
            [ -d "$d" ] || continue
            cp -r "$d/screenshots/." "$OUT/screenshots/" 2>/dev/null || true
            cp -r "$d/logs/." "$OUT/logs/" 2>/dev/null || true
            cat "$d"/result-*.txt >> "$OUT/STATUS.txt" 2>/dev/null || true
          done
          echo "emulador: ${{ needs.device.result }}" >> "$OUT/STATUS.txt"
          cat "$OUT/STATUS.txt"
          cd "$OUT"
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Resultados de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output

      - name: Publicar o APK (Releases, "ultima-versao")
        if: needs.device.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp artifacts/build/apks/app-release.apk "PrumoPDF-Android-$VERSION.apk"
          gh release delete ultima-versao -y --cleanup-tag 2>/dev/null || true
          gh release create ultima-versao "PrumoPDF-Android-$VERSION.apk" \
            --title "Prumo PDF para Android $VERSION (versão de teste)" \
            --notes "Gerado pelo GitHub Actions a partir do commit ${GITHUB_SHA::7}. Versão de teste, assinada com a chave de teste do repositório (não é a do Google Play). Para instalar: baixe o APK no Android e permita a instalação de apps desta fonte." \
            --prerelease
